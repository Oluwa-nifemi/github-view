<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Move GitHub Digest</title>
    <link rel="stylesheet" href="src/styles/base.css" />
    <script src="scripts/export-legacy.js" defer></script>
  </head>
  <body>
    <main class="wrap">
      <h1>GitHub Digest has moved</h1>
      <p>
        The dashboard now runs locally at
        <a href="http://127.0.0.1:4173">127.0.0.1:4173</a>.
      </p>
      <p>
        Export your notes and preferences here, then import them in the
        dashboard's Settings. Your token stays in this browser and is not
        included in the export.
      </p>
      <p>
        <label
          ><input id="include-content" type="checkbox" /> Include cached pull
          requests and notification history</label
        >
      </p>
      <button id="export" type="button">Export settings</button>
      <p id="status" role="status"></p>
      <p>For first-time setup, see <a href="README.md">README.md</a>.</p>
    </main>
  </body>
</html>
